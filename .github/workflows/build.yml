name: build

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: 打包
        run: python -m PyInstaller --noconfirm --clean 发票助手.spec

      - name: 压成 zip
        run: |
          Copy-Item README.md, LICENSE -Destination dist/发票助手/ -Force
          Compress-Archive -Path dist/发票助手 -DestinationPath dist/invoice-assistant-windows-x64.zip -Force
          Get-Item dist/invoice-assistant-windows-x64.zip | Select-Object Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: invoice-assistant-windows-x64
          path: dist/invoice-assistant-windows-x64.zip

      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: dist/invoice-assistant-windows-x64.zip
